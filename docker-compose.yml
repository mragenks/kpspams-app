version: '3.8'

services:
  # Database MySQL
  db_kpspams:
    image: mysql:8.0
    container_name: db_kpspams
    restart: always
    environment:
      MYSQL_DATABASE: db_kpspams
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_PASSWORD: userpassword
      MYSQL_USER: ageng_user
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # phpMyAdmin untuk kelola database lewat browser
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db_kpspams
    depends_on:
      - db_kpspams

volumes:
  db_data: